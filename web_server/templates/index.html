<!DOCTYPE html>
<html>

<head>
    <title>Bank of Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        h1 {
            color: #1a73e8;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        a:hover {
            background-color: #1557b0;
        }
    </style>
</head>

<body>
    <h1>Welcome to Bank of Simulation</h1>
    <p>Please login to access your account.</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
    <p style="color: green; font-weight: bold;">{{ message }}</p>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div style="margin: 20px;">
        <a href="/login">Go to Login</a>
    </div>

    <div style="margin-top: 20px; font-size: 0.8em;">
        <p>Security Controls:</p>
        <a href="/toggle_security" style="background-color: #5f6368;">Toggle HSTS Protection</a>
    </div>
</body>

</html>
